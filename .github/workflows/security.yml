name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  workflow-policy:
    name: Workflow, pin and container policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go test ./internal/cipolicy -count=1
          python3 scripts/test-scrub-artifact.py
          bash scripts/check-actions-pinned.sh
          bash scripts/check-container-security.sh
          bash scripts/install-ci-tool.sh actionlint
          bash scripts/install-ci-tool.sh zizmor
      - run: actionlint -shellcheck=''
      - run: zizmor --offline --pedantic .github/workflows
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/install-ci-tool.sh gitleaks
      - run: gitleaks git --redact --exit-code 1 .
  dependencies:
    name: Vulnerabilities, SBOM and license inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
          bash scripts/install-ci-tool.sh trivy
          bash scripts/install-ci-tool.sh syft
      - run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .
      - name: Inventory and scrub
        run: |
          mkdir -p .ci-private artifacts
          syft dir:. -o spdx-json=.ci-private/sbom.json
          syft dir:. -o syft-json=.ci-private/licenses.json
          python3 scripts/scrub-artifact.py .ci-private/sbom.json artifacts/sbom.spdx.json
          python3 scripts/scrub-artifact.py .ci-private/licenses.json artifacts/licenses.json
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review pull request changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-severity: high
      - name: Verify locked modules outside pull requests
        if: github.event_name != 'pull_request'
        run: |
          test -s go.sum
          git diff --exit-code -- go.mod go.sum
  codeql-analysis:
    name: CodeQL analysis without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: false
          output: .ci-private/codeql
      - name: Reject CodeQL security findings
        run: |
          python3 scripts/check-codeql.py .ci-private/codeql
  freshness:
    name: Scheduled dependency freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify current application and runtime pins
        run: |
          bash scripts/check-deps-fresh.sh
          python3 scripts/check-runtime-fresh.py
  required:
    name: Security required
    if: always()
    needs: [workflow-policy, secrets, dependencies, dependency-review, codeql-analysis, freshness]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 6 and all(.[]; .result == "success")' <<< "$RESULTS"
