name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {} # allows release.yml to run the full test suite before releasing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  fmt-vet:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2 # v2 line — matches the v2 config schema in .golangci.yml
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt-vet]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Linux runners need a TTF font + Chrome installed for the built-in
      # renderer and headless-Chrome tests to exercise real rendering
      # instead of skipping. macOS/Windows runner images ship Chrome and
      # a system Arial-equivalent font already.
      - name: Install fonts + Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation google-chrome-stable
          echo "INVOICE_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"

      - name: Build
        run: go build -v ./...

      # Race detector needs cgo/a C toolchain. Ubuntu/macOS runners have
      # one preinstalled; Windows runners generally don't by default, so
      # that leg runs without -race but keeps full functional coverage.
      - name: Test (race + coverage)
        if: runner.os != 'Windows'
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -v

      - name: Test (coverage)
        if: runner.os == 'Windows'
        run: go test ./... -covermode=atomic -coverprofile=coverage.out -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14

  build-matrix:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [fmt-vet]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/invoice

  dependency-freshness:
    name: Dependency freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fail if a direct dependency is outdated
        run: bash scripts/check-deps-fresh.sh
