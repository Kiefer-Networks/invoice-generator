name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Format, vet, staticcheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and vet
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          go vet ./...
      - name: Pinned static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # Staticcheck 2026.2.1; authenticated by Go checksum database.
          staticcheck ./...
          bash scripts/install-ci-tool.sh golangci-lint
      - run: golangci-lint run --timeout=10m
  tests:
    name: Race and coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require rendering tools
        run: |
          java --version
          javac --version
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "INVOICE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
            echo 'INVOICE_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
          fi
      - run: bash scripts/run-ci-tests.sh all
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  migrations:
    name: Migration matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/run-ci-tests.sh migrations
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrations-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  oidc:
    name: Oidc security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/run-ci-tests.sh oidc
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  browser:
    name: Browser security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require Chrome, Java and fonts
        run: |
          command -v google-chrome || command -v chromium
          command -v java
          command -v javac
          fc-match LiberationSans | grep -q Liberation
          if command -v google-chrome >/dev/null; then
            echo "INVOICE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "INVOICE_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
      - run: bash scripts/run-ci-tests.sh browser
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  documents:
    name: Documents security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require Chrome, Java and fonts
        run: |
          command -v google-chrome || command -v chromium
          command -v java
          command -v javac
          fc-match LiberationSans | grep -q Liberation
          if command -v google-chrome >/dev/null; then
            echo "INVOICE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "INVOICE_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
      - run: bash scripts/run-ci-tests.sh documents
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documents-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  numbering:
    name: Numbering security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/run-ci-tests.sh numbering
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numbering-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  paperless:
    name: Paperless security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/run-ci-tests.sh paperless
      - name: Upload scrubbed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperless-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  visual:
    name: Pinned browser and PDF visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Buildx
        run: bash scripts/install-ci-tool.sh buildx
      - run: bash scripts/test-visual.sh
  cross-build:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go build -tags=production -trimpath -o /dev/null ./cmd/server
          go build -trimpath -o /dev/null ./cmd/invoice
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
  required:
    name: CI required
    if: always()
    needs: [quality, tests, migrations, oidc, browser, documents, numbering, paperless, visual, cross-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 10 and all(.[]; .result == "success")' <<< "$RESULTS"
