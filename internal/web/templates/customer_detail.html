{{define "customerDetail"}}<h2>{{.Customer.DisplayName}}</h2><dl><dt>Customer number</dt><dd>{{.Customer.Number}}</dd><dt>Email</dt><dd>{{.Customer.Email}}</dd><dt>Country</dt><dd>{{.Customer.Country}}</dd></dl><a href="/customers/{{.Customer.ID}}/edit">Edit customer</a>{{if .Customer.Active}}<form method="post" action="/customers/{{.Customer.ID}}/archive"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="version" value="{{.Customer.Version}}"><button type="submit">Archive customer</button></form>{{else}}<p>Archived</p><form method="post" action="/customers/{{.Customer.ID}}/restore"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="version" value="{{.Customer.Version}}"><button type="submit">Restore customer</button></form>{{end}}{{end}}
