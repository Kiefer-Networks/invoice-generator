version: "2"

linters:
  default: standard
  enable:
    - gosec       # security-focused static analysis
    - errcheck    # unchecked errors
    - staticcheck # bugs, deprecated API usage, simplifications
    - unused      # dead code
    - ineffassign # ineffectual assignments
    - misspell
    - unconvert
    - bodyclose
  settings:
    gosec:
      excludes:
        # G304 (file inclusion via variable) / G703 (path traversal via
        # taint analysis): this is a local CLI tool — every "variable
        # path" it opens is a path the same user passed explicitly via a
        # CLI flag or a config file field. That is the tool's entire
        # purpose, not an attacker-controlled input.
        - G304
        - G703
        # G204 (subprocess launched with variable): invoking a
        # user/system-discovered Chrome/Chromium/Edge binary with a
        # fixed set of flags is this renderer's whole job.
        - G204
    misspell:
      ignore-rules:
        # "Preventivo" (Italian for "quote/estimate") is a genuine label,
        # not a misspelling of "Prevention".
        - Preventivo
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
