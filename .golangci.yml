version: "2"

linters:
  default: standard
  enable:
    - gosec       # security-focused static analysis
    - errcheck    # unchecked errors
    - staticcheck # bugs, deprecated API usage, simplifications
    - unused      # dead code
    - ineffassign # ineffectual assignments
    - misspell
    - unconvert
    - bodyclose
  settings:
    misspell:
      ignore-rules:
        # "Preventivo" (Italian for "quote/estimate") is a genuine label,
        # not a misspelling of "Prevention".
        - Preventivo
  exclusions:
    rules:
      - path: _test\.go
        text: 'Error return value of .*\.(Close|RemoveAll|Rollback)'
        linters:
          # Only cleanup errors may be discarded in test fixtures. Test setup,
          # database operations, subprocesses and security analysis stay checked.
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
